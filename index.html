<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Straumur – myndbandasafn</title>
<meta name="description" content="Kennslumyndbönd í rafmagni og rafeindatækni frá kennurum – flokkuð og leitanleg.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f59e0b'/%3E%3Cpath d='M7 16c3-8 6-8 9 0s6 8 9 0' fill='none' stroke='%23142033' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
<header class="haus">
  <div class="haus-innri">
    <a class="merki" href="#" data-heim aria-label="Straumur – forsíða">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17"/><path d="M8 20c3.5-10 8.5-10 12 0s8.5 10 12 0"/></svg>
      <span><strong>Straumur</strong><small>Myndbandasafn fyrir rafmagnsnema</small></span>
    </a>
    <div class="leit">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
      <input id="leit" type="search" placeholder="Leita, t.d. díóða, fasvik, Ohm, mótor…" autocomplete="off" aria-label="Leita að myndbandi">
      <kbd title="Ýttu á / til að leita">/</kbd>
      <button type="button" id="leit-hreinsa" class="leit-x" hidden aria-label="Hreinsa leit">✕</button>
    </div>
  </div>
  <div class="vir" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
</header>

<main class="efni">
  <section aria-labelledby="kennarar-h">
    <h2 id="kennarar-h" class="yfir">Kennarar</h2>
    <div id="kennarar" class="moppur"></div>
  </section>

  <section class="siur" aria-label="Síur">
    <div id="flokkar" class="flogar" role="group" aria-label="Efnisflokkar"></div>
    <div class="siur-rod">
      <label>Lengd
        <select id="lengd">
          <option value="">Allar lengdir</option>
          <option value="stutt">Styttri en 5 mín</option>
          <option value="mid">5–15 mín</option>
          <option value="long">Lengri en 15 mín</option>
        </select>
      </label>
      <label>Röðun
        <select id="rod">
          <option value="">Eftir efni</option>
          <option value="styst">Styst fyrst</option>
          <option value="lengst">Lengst fyrst</option>
          <option value="abc">Stafrófsröð</option>
        </select>
      </label>
      <label class="rofi"><input type="checkbox" id="oskodad"> Fela það sem ég hef skoðað</label>
    </div>
  </section>

  <div id="tillogur" class="tillogur"></div>
  <div id="svaedi" aria-live="polite"></div>
</main>

<footer class="fotur">
  <p>Myndböndin eru í eigu kennaranna sem gerðu þau. Hægt er að bæta við fleiri kennurum – sjá <code>README.md</code>.</p>
</footer>

<dialog id="spilari" aria-labelledby="sp-titill">
  <div class="sp-haus">
    <div>
      <p id="sp-slod" class="sp-slod"></p>
      <h2 id="sp-titill"></h2>
    </div>
    <button class="hnappur takn" id="sp-loka" aria-label="Loka">✕</button>
  </div>
  <div class="sp-likami">
    <div class="sp-adal">
      <div class="sp-mynd" id="sp-mynd"></div>
      <div class="sp-stjorn">
        <button class="hnappur" id="sp-fyrra">‹ Fyrra</button>
        <span id="sp-nr" class="sp-nr"></span>
        <button class="hnappur" id="sp-naesta">Næsta ›</button>
        <span class="bil"></span>
        <a class="hnappur" id="sp-yt" target="_blank" rel="noopener">Opna á YouTube ↗</a>
        <button class="hnappur" id="sp-afrita">Afrita tengil</button>
      </div>
    </div>
    <aside class="sp-listi">
      <h3 id="sp-listi-h">Í þessum lista</h3>
      <ol id="sp-listi"></ol>
    </aside>
  </div>
</dialog>

<script src="data/kennarar.js"></script>
<script src="app.js"></script>
</body>
</html>
